<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/Registration/Css/Signup_style.css" />
    <title>Sign Up</title>
  </head>
  <body>
    <div class="already">
      <div class="container">
        <div class="rg">
          <img
            src="/Registration/Images/signup.png"
            class="login-image"
            alt="sign up"
          />
          <h3>Sign Up</h3>
        </div>
        <!-- <hr> -->
        <form>
          <div class="names">
            <input type="text" placeholder="First Name" required />
            <input type="text" placeholder="Last Name" required />
          </div>
          <div class="details">
            <input type="email" placeholder="E-mail" required />
            <input type="password" placeholder="Password" required />
            <input type="password" placeholder="Cofirm Password" required />
          </div>
          <div class="T_C">
            <p>
              <input type="checkbox" id="option1" name="option1" /> I accept the
              <a href="#">Terms of Use</a> & <a href="#">Privacy Policy.</a>
            </p>
          </div>
          <button type="submit">Sign Up</button>
        </form>
      </div>
      <p>
        Already have an account?
        <a href="/Registration/Html/Login.html">Login here.</a>
      </p>
    </div>
  </body>
</html>
